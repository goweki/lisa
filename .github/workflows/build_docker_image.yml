name: Build Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build
        id: build
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}  # First 8 characters of commit hash
          IMAGE_NAME=ghcr.io/goweki/lisa:$IMAGE_TAG
          echo "Building docker image $IMAGE_NAME"
          cp env.template .env.local
          docker build -t $IMAGE_NAME -t ghcr.io/goweki/lisa:latest .
          # docker push $IMAGE_NAME
          # docker push ghcr.io/goweki/lisa:latest
          # echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          # echo "Docker image pushed: $IMAGE_NAME"

